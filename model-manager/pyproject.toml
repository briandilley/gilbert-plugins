[project]
name = "gilbert-plugin-model-manager"
version = "1.0.0"
description = "Local model manager for Gilbert — browse, fit-check, and pull local models via Ollama"
requires-python = ">=3.12"
# No third-party deps beyond Gilbert's core. The manager drives the local
# runtime (Ollama) through the ``local_model_runtime`` capability the ollama
# plugin advertises, and browses the Hugging Face Hub catalog over
# ``httpx`` — which is already a Gilbert core dependency, so nothing extra
# is needed here.
dependencies = []

[tool.uv]
package = false
