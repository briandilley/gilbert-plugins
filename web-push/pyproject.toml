[project]
name = "gilbert-plugin-web-push"
version = "1.0.0"
description = "Web Push (VAPID) notification backend for Gilbert."
requires-python = ">=3.12"
dependencies = [
    # pywebpush handles the ECDH-ES payload encryption and VAPID JWT
    # signing. It pulls in ``cryptography`` transitively, but we pin
    # cryptography explicitly here so a bump shows up in our own
    # dependency graph rather than getting silently pulled in.
    "pywebpush>=2.0.0",
    "cryptography>=42.0.0",
]

[tool.uv]
package = false
